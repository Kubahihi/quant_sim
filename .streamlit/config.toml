[server]
headless = true
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 20
# Deployment processes are immutable; disabling source watching avoids a
# needless filesystem observer and module scan on every cold container.
fileWatcherType = "none"
runOnSave = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"

[theme]
base = "light"
primaryColor = "#167d78"
font = "sans-serif"
baseFontSize = 15
baseRadius = "0.45rem"
buttonRadius = "0.4rem"
showWidgetBorder = true
showSidebarBorder = true
# Shared mid-tone series colors have >=3:1 contrast on both chart backgrounds.
# Streamlit 1.58 supports this option at theme level, not theme.light/theme.dark.
chartCategoricalColors = ["#0f8a80", "#3b82f6", "#a06cd5", "#c67916", "#e14d72", "#6d8d25"]

[theme.light]
primaryColor = "#0f766e"
backgroundColor = "#f8fafb"
secondaryBackgroundColor = "#ffffff"
textColor = "#17212b"
borderColor = "#cbd5df"
linkColor = "#0f766e"

[theme.dark]
primaryColor = "#167d78"
backgroundColor = "#111827"
secondaryBackgroundColor = "#182230"
textColor = "#f1f5f9"
borderColor = "#3a4a5d"
linkColor = "#69d2c4"
