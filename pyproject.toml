[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".codex_pytest_wave2_target",
    ".testdeps",
    ".venv",
    "_venv_",
]

[tool.ruff.lint]
# Start with correctness rules that are suitable as a blocking CI gate. Broader
# style cleanup can be enabled incrementally without creating a noisy migration.
select = ["E9", "F63", "F7", "F82"]
